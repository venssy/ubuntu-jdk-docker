name: Docker Build and Push (Variable Version)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# --- 定义全局变量 ---
env:
  ACR_REGISTRY: "registry.cn-hangzhou.aliyuncs.com" # 注册中心地址
  IMAGE_NAME: "venssy/ubuntu-jdk:22.04-8"    # 镜像命名空间与名称 
# ------------------

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max